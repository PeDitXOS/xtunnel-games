name: Build & Release

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-check:
    name: Build Check (Windows target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Cargo check (Windows target)
        run: |
          cd src-tauri
          cargo check --target x86_64-pc-windows-msvc

  build-windows:
    name: Build Windows (x64)
    needs: build-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Download Aether binary
        run: |
          $aetherUrl = "https://github.com/CluvexStudio/Aether/releases/download/v1.1.1/aether-windows-x86_64.zip"
          $zipPath = "$env:RUNNER_TEMP\aether-windows.zip"
          Invoke-WebRequest -Uri $aetherUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\aether" -Force
          Copy-Item "$env:RUNNER_TEMP\aether\aether.exe" "src-tauri\binaries\aether.exe" -Force
          Write-Host "aether.exe bundled"

      - name: Download sing-box binary
        run: |
          $singboxUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.10.0/sing-box-1.10.0-windows-amd64.zip"
          $zipPath = "$env:RUNNER_TEMP\sing-box-windows.zip"
          Invoke-WebRequest -Uri $singboxUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\sing-box" -Force
          Copy-Item "$env:RUNNER_TEMP\sing-box\sing-box-1.10.0-windows-amd64\sing-box.exe" "src-tauri\binaries\sing-box.exe" -Force
          Write-Host "sing-box.exe bundled"

      - name: Download Xray binary
        run: |
          $xrayUrl = "https://github.com/XTLS/Xray-core/releases/download/v24.5.30/Xray-windows-64.zip"
          $zipPath = "$env:RUNNER_TEMP\xray-windows.zip"
          Invoke-WebRequest -Uri $xrayUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\xray" -Force
          Copy-Item "$env:RUNNER_TEMP\xray\xray.exe" "src-tauri\binaries\xray.exe" -Force
          Write-Host "xray.exe bundled"

      - name: Download wintun.dll
        run: |
          $wintunUrl = "https://github.com/WireGuard/wintun/releases/download/0.14.1/wintun-0.14.1.zip"
          $zipPath = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -Uri $wintunUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\wintun" -Force
          Copy-Item "$env:RUNNER_TEMP\wintun\x64\wintun.dll" "src-tauri\binaries\wintun.dll" -Force
          Write-Host "wintun.dll bundled"

      - name: Download WinDivert
        run: |
          $windivertUrl = "https://github.com/basil00/Divert/releases/download/v2.1.0/WinDivert-2.1.0.zip"
          $zipPath = "$env:RUNNER_TEMP\windivert.zip"
          Invoke-WebRequest -Uri $windivertUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\windivert" -Force
          Copy-Item "$env:RUNNER_TEMP\windivert\x64\WinDivert.dll" "src-tauri\binaries\WinDivert.dll" -Force
          Copy-Item "$env:RUNNER_TEMP\windivert\x64\WinDivert64.sys" "src-tauri\binaries\WinDivert64.sys" -Force
          Write-Host "WinDivert bundled"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Xtunnel Games ${{ github.ref_name }}"
          releaseBody: |
            ## Xtunnel Games ${{ github.ref_name }}
            
            ### Downloads
            - `xtunnel-games-${{ github.ref_name }}-x64.exe` - Complete installer with bundled Aether/sing-box/Xray
            
            ### Features
            - Split tunneling for games, launchers, and apps
            - Aether (serverless: MASQUE/WireGuard/gool)
            - V2Ray/Xray, WireGuard, OpenVPN, SOCKS5/HTTP proxy
            - Per-app PID-based WinDivert routing
            - Gaming-optimized: UDP, gVisor, low latency
            
            ### Requirements
            - Windows 10/11 (x64)
            - Run as Administrator for WinDivert
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtunnel-games-${{ github.ref_name }}-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/*.msi
          retention-days: 30
