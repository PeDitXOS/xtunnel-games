[package]
name = "xtunnel-games"
version = "0.1.0"
description = "Xtunnel Games - Split tunneling for games and apps via Aether"
authors = ["Xtunnel Games Team"]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/peditxos/xtunnel-games"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }
anyhow = "1"
thiserror = "1"
sysinfo = "0.30"
winreg = "0.52"
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "handleapi", "errhandlingapi", "libloaderapi", "winnt", "minwindef", "shellapi", "winerror"] }
windivert = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
async-trait = "0.1"